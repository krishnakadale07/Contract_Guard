openapi: 3.0.3
info:
  title: Demo Users API
  version: "1.0.0"
paths:
  /users:
    get:
      operationId: listUsers
      summary: List users
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, inactive, pending]
      responses:
        "200":
          description: A list of users
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      required: [id, email]
                      properties:
                        id:
                          type: string
                        email:
                          type: string
                        name:
                          type: string
        "400":
          description: Invalid query parameters
  /users/{id}:
    get:
      operationId: getUser
      summary: Get a single user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A single user
          content:
            application/json:
              schema:
                type: object
                required: [id, email]
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  name:
                    type: string
        "404":
          description: User not found
    delete:
      operationId: deleteUser
      summary: Delete a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: User not found
